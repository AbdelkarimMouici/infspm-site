# Decap CMS configuration. The backend (GitHub repo, OAuth base URL) is set in src/admin/cms.ts.
# Field names and rules mirror src/content/schemas.ts: the site build rejects invalid entries.
# Editor guide: docs/CMS.md

# Every change becomes a pull request (Drafts → In review → Ready). Nothing reaches the site
# until a maintainer merges it, and only `status: published` entries are shown.
publish_mode: editorial_workflow

# Images are committed to the repository and processed at build time (resized, WebP, metadata stripped).
media_folder: src/assets/uploads
public_folder: ../../../assets/uploads

locale: ar

i18n:
  structure: multiple_folders
  locales: [ar, fr, en]
  default_locale: ar

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: news
    label: الأخبار / Actualités / News
    label_singular: خبر / Actualité / News item
    folder: src/content/news
    create: true
    i18n: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{fields.fileSlug}}'
    summary: '{{title}} ({{status}})'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - name: fileSlug
        label: File name (latin letters, digits and hyphens, e.g. open-day-2026)
        hint: Used in the page address. Cannot be changed later.
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase latin letters, digits and single hyphens only']
        i18n: duplicate
      - { name: summary, label: Summary, widget: text, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - name: status
        label: Status
        widget: select
        options: [draft, published]
        default: draft
        i18n: true
      - { name: needs-review, label: Translation needs review, widget: boolean, default: false, required: false, i18n: true }
      - { name: source, label: Source, widget: hidden, default: manual, i18n: duplicate }
      - { name: fbPostId, label: Facebook post id, widget: hidden, required: false, i18n: duplicate }
      - { name: fbPermalink, label: Facebook link, widget: hidden, required: false, i18n: duplicate }
      - name: careFlags
        label: Needs a decision before publishing
        hint: Memorials, identifiable students or patients, personal content. Remove the flag only after a human decision.
        widget: select
        multiple: true
        required: false
        options: [memorial, identifiable-people, personal, other]
        i18n: duplicate
      - name: images
        label: Images
        widget: list
        required: false
        i18n: true
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alternative text (describe the image), widget: string }
      - { name: body, label: Text, widget: markdown, i18n: true, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }

  - name: activities
    label: الأنشطة / Activités / Activities
    label_singular: نشاط / Activité / Activity
    folder: src/content/activities
    create: true
    i18n: true
    extension: md
    format: frontmatter
    slug: '{{year}}-{{month}}-{{day}}-{{fields.fileSlug}}'
    summary: '{{title}} ({{status}})'
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - name: fileSlug
        label: File name (latin letters, digits and hyphens, e.g. open-day-2026)
        hint: Used in the page address. Cannot be changed later.
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase latin letters, digits and single hyphens only']
        i18n: duplicate
      - { name: summary, label: Summary, widget: text, required: false, i18n: true }
      - { name: date, label: Start date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, i18n: duplicate }
      - { name: endDate, label: End date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false, i18n: duplicate }
      - { name: location, label: Location, widget: string, required: false, i18n: true }
      - { name: status, label: Status, widget: select, options: [draft, published], default: draft, i18n: true }
      - { name: needs-review, label: Translation needs review, widget: boolean, default: false, required: false, i18n: true }
      - name: images
        label: Images
        widget: list
        required: false
        i18n: true
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alternative text (describe the image), widget: string }
      - { name: body, label: Text, widget: markdown, i18n: true, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }

  - name: programs
    label: برامج التكوين / Formations / Programs
    label_singular: برنامج / Formation / Program
    folder: src/content/programs
    create: true
    i18n: true
    extension: md
    format: frontmatter
    slug: '{{fields.fileSlug}}'
    summary: '{{title}} ({{status}})'
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - name: fileSlug
        label: File name (latin letters, digits and hyphens, e.g. open-day-2026)
        hint: Used in the page address. Cannot be changed later.
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Use lowercase latin letters, digits and single hyphens only']
        i18n: duplicate
      - { name: summary, label: Summary, widget: text, required: false, i18n: true }
      - { name: order, label: Display order, widget: number, value_type: int, default: 100, i18n: duplicate }
      - { name: duration, label: Duration (as confirmed by the administration), widget: string, required: false, i18n: true }
      - { name: diploma, label: Diploma, widget: string, required: false, i18n: true }
      - { name: admission, label: Admission requirements (short), widget: text, required: false, i18n: true }
      - { name: status, label: Status, widget: select, options: [draft, published], default: draft, i18n: true }
      - { name: needs-review, label: Translation needs review, widget: boolean, default: false, required: false, i18n: true }
      - name: image
        label: Image
        widget: object
        required: false
        i18n: true
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alternative text, widget: string }
      - { name: body, label: Text, widget: markdown, i18n: true, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }

  - name: pages
    label: الصفحات / Pages / Pages
    label_singular: صفحة / Page / Page
    folder: src/content/pages
    create: false
    delete: false
    i18n: true
    extension: md
    format: frontmatter
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: description, label: Search engine description (max 170 characters), widget: text, i18n: true }
      - { name: status, label: Status, widget: select, options: [draft, published], default: draft, i18n: true }
      - { name: needs-review, label: Translation needs review, widget: boolean, default: false, required: false, i18n: true }
      - { name: body, label: Text, widget: markdown, i18n: true, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote] }
