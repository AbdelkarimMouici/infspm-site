# Private Worker that emails contact-form messages to the institute. Deploy: see docs/DEPLOYMENT.md.
# NOT deployed or tested against a live account yet (needs the institute's domain on Cloudflare).
name = "infspm-contact-mailer"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# No public URL: reachable only through the Pages project's service binding CONTACT_MAILER.
workers_dev = false
preview_urls = false

[[send_email]]
name = "EMAIL"
# TODO(content): the institute's verified destination address (Email Routing → Destination addresses).
destination_address = "infspmtebessa@inpfp.dz"

[vars]
# TODO(content): a sender address on the institute's domain once the domain is on Cloudflare.
MAIL_FROM = "contact-form@example.invalid"
MAIL_TO = "infspmtebessa@inpfp.dz"
